name: Build para HostGator

# Gera o site (npm run build) e publica o resultado na branch "deploy".
# O cPanel (Git Version Control) puxa a branch "deploy" e copia para public_html.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Incluir .cpanel.yml no build
        run: cp .cpanel.yml dist/

      - name: Publicar dist na branch deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
